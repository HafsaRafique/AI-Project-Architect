version: "3.8"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: rpg-chess-ollama
    ports:
      - "11434:11434"     # optional, only needed if you want to hit it directly
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    # Uncomment to use an NVIDIA GPU (requires nvidia-container-toolkit on the host):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  app:
    build: .
    container_name: rpg-chess-app
    ports:
      - "5000:5000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=llama3.2
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_models:
