<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>WebVisual</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>WebVisual</h1>
    <span id="statusDot" class="dot offline" title="Backend status"></span>
  </header>

  <section id="authView">
    <div class="tabs">
      <button id="tabLogin" class="tab active">Log in</button>
      <button id="tabRegister" class="tab">Sign up</button>
    </div>
    <input id="email" type="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Password" />
    <button id="submitAuth" class="primary">Log in</button>
    <p id="authError" class="error"></p>

    <details>
      <summary>Server settings</summary>
      <input id="apiBase" type="text" placeholder="server" />
      <button id="saveApiBase">Save</button>
    </details>
  </section>

  <section id="mainView" class="hidden">
    <button id="captureBtn" class="primary">Capture this page</button>
    <p id="captureStatus" class="muted"></p>

    <div class="ask-box">
      <input id="question" type="text" placeholder="Ask about your captured pages..." />
      <button id="askBtn">Ask</button>
    </div>
    <div id="answer" class="answer hidden"></div>

    <h2>Recent pages</h2>
    <ul id="pageList"></ul>

    <button id="logoutBtn" class="link">Log out</button>
  </section>

  <script src="popup.js"></script>
</body>
</html>
